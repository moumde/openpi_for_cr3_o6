<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Pi05 CR3/O6 Demonstrations</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Segoe UI", sans-serif; background: #0b1220; color: #eef4ff; }
    body { margin: 0; }
    header { max-width: 1080px; margin: 0 auto; padding: 44px 24px 16px; }
    header p { color: #9eb2d0; margin: 0 0 8px; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.8rem); }
    main { max-width: 1080px; margin: 0 auto; padding: 12px 24px 48px; display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
    section { padding: 18px; background: #121d30; border: 1px solid #253550; border-radius: 16px; }
    h2 { margin: 0 0 8px; font-size: 1.35rem; }
    section p { color: #b8c7dc; margin: 0 0 14px; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; }
  </style>
</head>
<body>
  <header>
    <p>Dobot CR3 + LinkerHand O6</p>
    <h1>Pi05 Demonstration Videos</h1>
  </header>
  <main>
    <section id="forward">
      <h2>电机正向识别抓取</h2>
      <p>Pi05 identifies the forward-facing motor and performs the grasp.</p>
      <video controls playsinline preload="metadata" poster="./视频/covers/pi05_motor_forward.jpg">
        <source src="./视频/pi05_电机正向识别.mp4" type="video/mp4">
        Your browser does not support HTML video playback.
      </video>
    </section>
    <section id="reverse">
      <h2>电机反向识别抓取</h2>
      <p>Pi05 identifies the reverse-facing motor and performs the grasp.</p>
      <video controls playsinline preload="metadata" poster="./视频/covers/pi05_motor_reverse.jpg">
        <source src="./视频/pi05_电机反向识别.mp4" type="video/mp4">
        Your browser does not support HTML video playback.
      </video>
    </section>
  </main>
</body>
</html>
